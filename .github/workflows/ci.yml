name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck knock install.sh tests/run.sh
      - name: tests
        run: bash tests/run.sh
